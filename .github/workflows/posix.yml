name: Linux and macOS desktop
on:
  push:
    branches: ['arena/319fd9b1-folderforge']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            screen: 1366x768
            text_size: '100%'
          - os: ubuntu-latest
            screen: 1920x1080
            text_size: '100%'
          - os: ubuntu-latest
            screen: 1366x768
            text_size: '150%'
          - os: macos-latest
            screen: native
            text_size: '100%'
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
      FOLDERFORGE_TEST_TEXT_SIZE: ${{ matrix.text_size }}
      FOLDERFORGE_TEST_SCREEN: ${{ matrix.screen }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux graphical test environment (runner only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb stalonetray
      - name: Dependencies (disposable runner only)
        run: python -m pip install -r requirements.txt psutil
      - name: Unit tests
        run: python tools/ci_tests.py
      - name: Linux X11 Tk and tray integration
        if: runner.os == 'Linux'
        env:
          PYSTRAY_BACKEND: xorg
        run: |
          xvfb-run -a -s "-screen 0 ${{ matrix.screen }}x24" bash -c '
            stalonetray --geometry 1x1+0+0 &
            tray_pid=$!
            trap "kill $tray_pid 2>/dev/null || true" EXIT
            python tools/posix_smoke.py
          '

      - name: macOS Cocoa Tk and tray integration
        if: runner.os == 'macOS'
        run: python tools/posix_smoke.py
      - name: Preserve desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence-${{ matrix.os }}-${{ matrix.screen }}-${{ matrix.text_size }}
          path: windows-evidence/
