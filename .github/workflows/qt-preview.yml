name: Default Qt desktop and recovery
on:
  push:
    branches: ['arena/319fd9b1-folderforge']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONUTF8: 1
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Qt OS libraries (disposable Linux runner only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 xvfb stalonetray
      - name: Optional preview dependencies (disposable runner only)
        run: python -m pip install -r requirements.txt psutil
      - name: Real Qt widgets, focus, geometry and storage isolation
        run: python tools/qt_smoke.py
      - name: Default Qt native desktop startup and update
        if: runner.os != 'Linux'
        run: python tools/qt_desktop_smoke.py
      - name: Default Qt X11 tray and update
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1366x768x24" bash -c '
            stalonetray --geometry 1x1+0+0 &
            tray_pid=$!
            trap "kill $tray_pid 2>/dev/null || true" EXIT
            python tools/qt_desktop_smoke.py
          '
